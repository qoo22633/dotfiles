# mise グローバル設定（~/.config/mise -> dotfiles/.config/mise）
# CLI ツール / 環境変数 / エイリアス / セットアップを mise に集約している。
# Registry にないツール・GUI アプリだけ Brewfile に残す。

[settings]
experimental = true # [hooks] に必要

[tools]
node = "lts"
python = "3.14"
go = "latest"
neovim = "latest"
deno = "latest"
sheldon = "latest"
fzf = "latest"
zoxide = "latest"
atuin = "latest"
yazi = "latest"
bat = "latest"
fd = "latest"
eza = "latest"
ripgrep = "latest"
ghq = "latest"
lazygit = "latest"
gh = "latest"
"npm:difit" = "latest" # ローカルコードレビューUI

[env]
XDG_CONFIG_HOME = "{{env.HOME}}/.config"
XDG_DATA_HOME = "{{env.HOME}}/.local/share"
XDG_CACHE_HOME = "{{env.HOME}}/.cache"
EDITOR = "nvim"
VISUAL = "nvim"
# zsh-abbr: ユーザー略語ファイル
ABBR_USER_ABBREVIATIONS_FILE = "{{env.HOME}}/.config/zsh-abbr/user-abbreviations"
# zeno: ファイルプレビューに bat を使用
ZENO_GIT_CAT = "bat"
# zeno: DenoがmacOSシステム証明書ストアを使用（SSL inspectionプロキシ対策）
DENO_TLS_CA_STORE = "system"
_.path = [
  "{{env.HOME}}/.local/bin",  # Claude Code (native install)
  "{{env.HOME}}/.cargo/bin",  # Rust cargo
]

[shell_alias]
ls = "eza --icons --git"
la = "eza -la --icons --git"
ll = "eza -aahl --icons --git"
ei = "eza --icons --git"
ea = "eza -la --icons --git"
ee = "eza -aahl --icons --git"
et = 'eza -T -L 3 -a -I "node_modules|.git|.cache" --icons'
cat = "bat"
# origin/HEAD が未設定のリポジトリでは `git remote set-head origin --auto` が必要
gsp = "git switch $(git symbolic-ref --short refs/remotes/origin/HEAD | sed 's@^origin/@@') && git pull --ff-only"

# デフォルトブランチ側の進みを含めず、現在のブランチで加えた変更だけを PR と同じ形で見るため merge-base と比較する
dd = "difit HEAD $(git merge-base HEAD origin/HEAD)"

[task_config]
dir = "{{ config_root }}/tasks"

[hooks]
postinstall = "bash ~/.config/mise/hooks/postinstall.sh"
