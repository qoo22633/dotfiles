onboarding = false
[[keys.command]]
key = "cmd+shift+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"

# popup: タブ構成を変えずにセッションモーダルな端末を開く
# width/height は端末セル数または "80%" のようなパーセント指定
[[keys.command]]
key = "prefix+d"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "zsh"
width = "80%"
height = "60%"

# Claude Code の /copy が書き出す直前の回答を nvim で開き、一部だけ選んでコピーする
# （prefix+c は既定の new_tab なので y = yank にしている）
[[keys.command]]
key = "prefix+y"
type = "popup"
command = "sh -c 'nvim \"/tmp/claude-$(id -u)/response.md\"'"
width = "80%"
height = "80%"

[experimental]
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "codex"]
cjk_ime_cursor_shape = "steady_block"
switch_ascii_input_source_in_prefix = true
